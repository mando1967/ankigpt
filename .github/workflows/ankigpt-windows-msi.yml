name: AnkiGPT Windows MSI

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version embedded in the MSI (leave blank to use .version)
        required: false
        type: string
  push:
    tags:
      - "ankigpt-v*"

permissions:
  contents: read

concurrency:
  group: ankigpt-windows-msi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-msi:
    name: Build Windows x64 MSI
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Anki build environment
        uses: ./.github/actions/setup-anki

      - name: Resolve installer version
        id: version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if ($env:REF_TYPE -eq "tag") {
            $version = $env:REF_NAME -replace '^ankigpt-v', ''
          } elseif ($env:REQUESTED_VERSION) {
            $version = $env:REQUESTED_VERSION.Trim()
          } else {
            $version = (Get-Content -Raw .version).Trim()
          }

          if ($version -notmatch '^\d+\.\d+(?:\.\d+)?(?:[abrc]\d+)?$') {
            throw "Unsupported installer version: '$version'"
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Building AnkiGPT MSI version $version"

      - name: Build application bundle
        shell: pwsh
        run: tools\ninja installer:build

      - name: Package MSI
        shell: pwsh
        run: >-
          out\pyenv\scripts\python.exe
          qt\tools\build_installer.py
          --version ${{ steps.version.outputs.version }}
          package

      - name: Verify and stage MSI
        id: installer
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath "out\installer\dist" -Filter "*.msi" -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one MSI, found $($installers.Count)."
          }

          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "release"
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null
          $name = "AnkiGPT-${{ steps.version.outputs.version }}-windows-x64.msi"
          $destination = Join-Path $releaseDir $name
          Copy-Item -LiteralPath $installers[0].FullName -Destination $destination
          "filename=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Get-FileHash -Algorithm SHA256 -LiteralPath $destination | Format-List

      - name: Upload MSI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AnkiGPT-${{ steps.version.outputs.version }}-windows-x64
          path: release/*.msi
          if-no-files-found: error
          retention-days: 30

      - name: Upload installer logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AnkiGPT-${{ steps.version.outputs.version }}-windows-build-logs
          path: out/installer/logs/
          if-no-files-found: ignore
          retention-days: 14

  publish-release:
    name: Publish tagged MSI
    if: github.ref_type == 'tag'
    needs: build-msi
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download MSI artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: AnkiGPT-*-windows-x64
          path: release
          merge-multiple: true

      - name: Create GitHub Release and attach MSI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          shopt -s nullglob
          installers=(release/*.msi)
          if (( ${#installers[@]} != 1 )); then
            echo "Expected exactly one downloaded MSI; found ${#installers[@]}." >&2
            exit 1
          fi

          if gh release view "$TAG_NAME" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${installers[0]}" --clobber --repo "$REPOSITORY"
          else
            gh release create "$TAG_NAME" "${installers[0]}" \
              --repo "$REPOSITORY" \
              --title "AnkiGPT ${TAG_NAME#ankigpt-v}" \
              --generate-notes
          fi
